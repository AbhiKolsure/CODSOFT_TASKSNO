server {
    listen 80 default_server;
    server_name codsoft.local localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    add_header X-Content-Type-Options "nosniff" always;
}
