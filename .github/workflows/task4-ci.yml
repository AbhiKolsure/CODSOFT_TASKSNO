name: Task 4 - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test application and build Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Task-1-Dockerized-Web-App
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest --junitxml=test-results.xml

      - name: Build Docker image (validation only)
        run: docker build -t codsoft-task1:latest .

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task1-pytest-report
          path: Task-1-Dockerized-Web-App/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  nginx-smoke-test:
    name: Smoke test Task 3 Nginx web server
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose configuration
        run: docker compose -f Task-3-Nginx-Web-Server/compose.yaml config --quiet

      - name: Run Nginx smoke tests
        run: bash .github/scripts/test-task3-nginx.sh